<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple — Redwoods</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--text:#1b2138;--text2:#6b7385;--accent:#5b50e8}
@media (prefers-color-scheme:dark){:root{--bg:#11131c;--card:#1a1d2b;--text:#eceef6;--text2:#9aa3b8}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:16px}
.card{background:var(--card);border-radius:16px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 28px rgba(28,35,60,.08)}
h1{font-size:28px;font-weight:800;margin-bottom:8px}
h1 span{color:var(--accent)}
p{color:var(--text2);line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>🍁 <span>Maple</span></h1>
  <p>maple.redwoods.solutions is live. Content coming soon.</p>
</div>
</body>
</html>
